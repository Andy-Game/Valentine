<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💘爱神来啦💘</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.3.1/dist/confetti.browser.min.js"></script>
    <style>
        /* 全局样式 */
        body {
            text-align: center;
            background-color: #FF69B4;
            color: white;
            font-family: Arial, sans-serif;
            padding-bottom: 60px;
        }

        /* 中奖消息样式 */
        #win-messages {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: #FFD700;
            padding: 15px 30px;
            border-radius: 15px;
            text-align: center;
            z-index: 1000;
            display: none;
            font-size: 18px;
            box-shadow: 0 0 20px rgba(255,215,0,0.5);
            border: 2px solid #FFD700;
            animation: float 15s ease-in-out infinite;
        }

        /* 浮动动画 */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

/* 创作者信息 */
.creator {
    position: fixed;
    bottom: 20px;
    right: 20px;
    font-size: 24px;
    font-family: ’Courier New‘, monospace;
    color: #FFFFFF; /* 白色字体 */
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.7); /* 白色光辉效果 */
    animation: float 3s ease-in-out infinite;
    padding: 10px;
    border: 3px solid #1E90FF; /* 海蓝色边框 */
    border-radius: 15px;
    background: linear-gradient(45deg, #00BFFF, #1E90FF, #4682B4); /* 海蓝色渐变背景 */
    background-clip: padding-box; /* 确保背景只在文本周围 */
    color: #FFFFFF; /* 白色字体，确保清晰可见 */
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5); /* 添加阴影效果 */
}

/* 可选的动画效果 */
@keyframes float {
    0% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0); }
}

        /* 主容器 */
        .container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            margin-top: 20px;
        }



        /* 老虎机容器 */
        .slot-machine {
            display: grid;
            grid-template-columns: repeat(3, 120px);
            gap: 10px;
            padding: 5px;
            background: linear-gradient(to bottom, #FF1493, #FF69B4);
            border-radius: 10px;
            border: 5px solid #FFD700;
            box-shadow: 0 0 20px yellow;
        }


        /* 老虎机格子 */
        .reel {
            width: 120px;
            height: 120px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            background-color: white;
            color: black;
            font-weight: bold;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 1);
        }


        .info h3 {
            color: yellow;
            margin-top: 0;
        }

        /* 按钮样式 */
        .spin-button {
            margin-top: 20px;
            font-size: 20px;
            padding: 10px 20px;
            background-color: red;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 5px 10px rgba(255, 0, 0, 0.5);
            transition: transform 0.2s;
        }

        .spin-button:hover {
            transform: scale(1.05);
        }
        /* 中奖倍率表 */

        .info {
   .info {
       position: absolute;
    left: 50%;
    top: 75%; /* 根据需要调整 */
    transform: translate(-50%, -50%);
    background: #222; /* 深色背景 */
    color: white;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    border: 3px solid #FFD700; /* 金色边框 */
    box-shadow: 0 0 15px rgba(255, 215, 0, 0.7); /* 金色光晕效果 */
    width: 280px; /* 适当调整大小 */
    font-size: 16px;
    font-weight: bold;
}
.info th, .info td {
    border: 2px solid #FFD700; /* 金色边框 */
    padding: 5px;
    text-align: center;
}
.info table {
    width: 100%;
    border-collapse: collapse; /* 让线条贴合 */
}
/* 添加表格样式 */
.info table {
    width: 100%;
    border-collapse: collapse; /* 让线条贴合 */
}

.info th, .info td {
    border: 2px solid #FFD700; /* 金色边框 */
    padding: 5px;
    text-align: center;
}

        }
        /* 排行榜样式 */
        .leaderboard {
            margin-top: 20px;
            font-size: 18px;
            color: yellow;
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 10px;
            display: inline-block;
        }

        /* 输入框样式 */
        .player-name-input input {
            font-size: 16px;
            padding: 8px;
            border-radius: 5px;
            border: 2px solid #FFD700;
            margin-right: 10px;
        }

        .player-name-input button {
            font-size: 16px;
            padding: 8px 15px;
            background-color: #FF69B4;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .player-name-input button:hover {
            background-color: #FF1493;
        }
    </style>
</head>
<body>
    <div id="win-messages"></div>
    <div class="creator">💘 Forever Andy Chen</div>

    <h1>💘爱神来啦💘</h1>
    <h3>🎲 选择下注金额，3个相同图案成线中奖！</h3>

    <div class="player-name-input">
        <input type="text" id="player-name" placeholder="输入你的名字">
        <button onclick="setPlayerName()">🚀 确认身份</button>
    </div>

    <div class="container">
        <!-- 3x3 轮盘 -->
        <div class="slot-machine">
            <div class="reel" id="r1c1">🏮</div>
            <div class="reel" id="r1c2">🍫</div>
            <div class="reel" id="r1c3">🌹</div>
            <div class="reel" id="r2c1">🚗</div>
            <div class="reel" id="r2c2">✈️</div>
            <div class="reel" id="r2c3">🏠</div>
            <div class="reel" id="r3c1">🛥️</div>
            <div class="reel" id="r3c2">💎</div>
            <div class="reel" id="r3c3">😍</div>
        </div>


    </div>

    <div class="bet-buttons">
        <button onclick="setBet(100)">💸 100金币</button>
        <button onclick="setBet(300)">💰 300金币</button>
        <button onclick="setBet(500)">💎 500金币</button>
        <button onclick="setBet(1000)">🏦 1000金币</button>
    </div>

    <button class="spin-button" onclick="spin()">🎰 开始</button>

    <div class="score">💰 当前资产：<span id="balance">1000</span> 金币</div>

    <div class="leaderboard">
        <h3>🏆 富豪排行榜：</h3>
        <ul id="leaderboard-list"></ul>
    </div>
        <!-- 中奖倍率表 -->
        <div class="info">
            <h3>🎰 中奖倍率表：</h3>
            🍫 巧克力	×11	<br>
            🌹 玫瑰	×22	<br>
            🚗 车子	×33	<br>
            ✈️ 飞机 	×55	<br>
            🏠 房子 	×66	<br>
            🛥️ 游艇 	×77	<br>
            🚁 直升机 	×88	<br>
            💎 钻石 	×99	<br>
            💵 钞票 	×100	<br>
            😍 爱神 	×1000	<br>
        </div>
    <h3>🎵 背景音乐：</h3>
    <audio id="background-music" src="https://www.kumeiwp.com/wj/10700/2022/01/06/1ebe08a89277f4edb71d749f8095858d.mp3" autoplay loop></audio>
    <h3>🎵 选择你的音乐：</h3>
    <input type="text" id="music-url" placeholder="https://www.kumeiwp.com/wj/10700/2022/01/06/1ebe08a89277f4edb71d749f8095858d.mp3">
    <button onclick="playMusic()">🎧 播放</button>
    <button onclick="pauseMusic()">⏸️ 暂停</button>

    <script>
        // 符号与倍率映射
        const symbols = {
            "🍫": 11, "🌹": 22, "🚗": 33, "✈️": 55,
            "🏠": 66, "🛥️": 77, "🚁": 88, "💎": 99,  "💵": 100, "😍": 1000
        };

        // 中奖语录
        const winQuotes = {
"🍫": "巧克力的甜蜜，就像你我之间的爱情，永远不腻！",
"🌹": "玫瑰花开，每一瓣都盛满了我们爱的承诺，真爱与美好未来同在！",
"🚗": "开着豪车，手牵着你，走过人生的每一段旅程，幸福满满！",
"✈️": "飞向天空，心随你而飞，爱情让我们征服一切障碍！",
"🏠": "有你的地方就是家，爱情的根基稳稳当当，温暖而坚实！",
"🛥️": "在爱的海洋中，我们一起扬帆远航，所有的风景都因你而美丽！",
"🚁": "和你一起飞翔，爱情让我们无所不能，心中无限高飞！",
"💎": "钻石般的爱情，璀璨永恒，岁月也无法磨灭它的光辉！",
"💵": "无论是爱还是财富，与你共度的每一刻都成了我生命中最珍贵的财富！",
"😍": "每一天和你在一起，心中充满幸福的笑声，爱与快乐永远相随！"
        };

        // 初始化变量
        let isNewPlayer = !localStorage.getItem('playerInitialized');
        let balance = isNewPlayer ? 10000 : parseInt(localStorage.getItem('balance')) || 1000;
        let currentBet = 100;
        let playerName = localStorage.getItem('playerName') || "神秘玩家";
        let leaderboard = JSON.parse(localStorage.getItem('leaderboard')) || [];

        // 页面加载时初始化
        document.getElementById('balance').textContent = balance;
        updateLeaderboard();
        checkDailyBonus();

        // 设置玩家名字
        function setPlayerName() {
            const nameInput = document.getElementById('player-name').value.trim();
            if (nameInput) {
                playerName = nameInput;
                localStorage.setItem('playerName', playerName);
                if (isNewPlayer) {
                    balance = 10000;
                    localStorage.setItem('balance', balance);
                    localStorage.setItem('playerInitialized', 'true');
                    document.getElementById('balance').textContent = balance;
                }
                alert(`🎉 欢迎 ${playerName} 加入爱神来啦！`);
                updateLeaderboard();
            } else {
                alert('⚠️ 请输入一个名字！');
            }
        }

        // 设置下注金额
        function setBet(amount) {
            currentBet = amount;
            alert(`💼 下注金额已设为：${amount}金币`);
        }

        // 旋转老虎机
        function spin() {
            if (balance < currentBet) {
                alert('💔 余额不足，快去赚钱！');
                return;
            }

            balance -= currentBet;
            updateDisplay();

            const reels = [
                ["r1c1", "r1c2", "r1c3"],
                ["r2c1", "r2c2", "r2c3"],
                ["r3c1", "r3c2", "r3c3"]
            ];

            const duration = 2000;
            const interval = setInterval(rotateReels, 100);
            setTimeout(() => processResult(reels), duration);

            function rotateReels() {
                reels.forEach(row => {
                    row.forEach(id => {
                        const keys = Object.keys(symbols);
                        document.getElementById(id).textContent =
                            keys[Math.floor(Math.random() * keys.length)];
                    });
                });
            }

            function processResult() {
                clearInterval(interval);
                const resultGrid = reels.map(row =>
                    row.map(id => document.getElementById(id).textContent)
                );
                const { totalWin, winMessages } = calculateWin(resultGrid);
                if (totalWin > 0) {
                    balance += totalWin;
                    fireConfetti();
                    new Audio('https://actions.google.com/sounds/v1/cartoon/clang.ogg').play();
                    showWinMessages(winMessages);
                }
                updateDisplay();
                updateLeaderboard();
            }
        }

        // 计算中奖结果
        function calculateWin(grid) {
            let totalWin = 0;
            const winMessages = [];
            const lines = [
                [grid[0][0], grid[0][1], grid[0][2]],
                [grid[1][0], grid[1][1], grid[1][2]],
                [grid[2][0], grid[2][1], grid[2][2]],
                [grid[0][0], grid[1][0], grid[2][0]],
                [grid[0][1], grid[1][1], grid[2][1]],
                [grid[0][2], grid[1][2], grid[2][2]],
                [grid[0][0], grid[1][1], grid[2][2]],
                [grid[0][2], grid[1][1], grid[2][0]]
            ];

            lines.forEach(line => {
                if (line[0] === line[1] && line[1] === line[2]) {
                    const symbol = line[0];
                    totalWin += currentBet * symbols[symbol];
                    if (winQuotes[symbol]) {
                        winMessages.push(winQuotes[symbol]);
                    }
                }
            });
            return { totalWin, winMessages };
        }

        // 显示中奖消息
        function showWinMessages(messages) {
            if (messages.length === 0) return;
            const messageContainer = document.getElementById('win-messages');
            messageContainer.innerHTML = messages.join('<br><br>');
            messageContainer.style.display = 'block';
            setTimeout(() => {
                messageContainer.style.display = 'none';
            }, Math.min(5000, messages.length * 2000));
        }

        // 更新排行榜
        function updateLeaderboard() {
            leaderboard = leaderboard.filter(entry =>
                entry?.name && typeof entry.score === 'number'
            );

            const existingIndex = leaderboard.findIndex(e => e.name === playerName);
            if (existingIndex > -1) {
                leaderboard[existingIndex].score = balance;
            } else {
                leaderboard.push({ name: playerName, score: balance });
            }

            leaderboard = leaderboard
                .sort((a, b) => b.score - a.score)
                .filter((v, i, a) => a.findIndex(t => t.name === v.name) === i)
                .slice(0, 10);

            localStorage.setItem('balance', balance);
            localStorage.setItem('leaderboard', JSON.stringify(leaderboard));

            const listElement = document.getElementById('leaderboard-list');
            listElement.innerHTML = leaderboard
                .map((entry, index) => `
                    <li>🏅 第${index + 1}名:
                        <span style="color:#FFD700">${entry.name}</span>
                        - ${entry.score}金币
                    </li>`
                ).join('');
        }

        // 更新余额显示
        function updateDisplay() {
            document.getElementById('balance').textContent = balance;
        }

        // 烟花效果
        function fireConfetti() {
            confetti({
                particleCount: 150,
                spread: 100,
                origin: { y: 0.6 },
                colors: ['#FF0000', '#00FF00', '#0000FF']
            });
        }

        // 音乐控制
        function playMusic() {
            const url = document.getElementById('music-url').value;
            const audio = document.getElementById('background-music');
            if (url) audio.src = url;
            audio.play();
        }

        function pauseMusic() {
            document.getElementById('background-music').pause();
        }

        // 每日奖励检查
        function checkDailyBonus() {
            const lastClaimDate = localStorage.getItem('lastClaimDate');
            const today = new Date().toISOString().split('T')[0];

            if (lastClaimDate !== today) {
                balance += 10000;
                localStorage.setItem('balance', balance);
                localStorage.setItem('lastClaimDate', today);
                document.getElementById('balance').textContent = balance;
                alert("🎉每日签到成功！已领取 10,000 金币！");
            }
        }
    </script>
</body>
</html>
